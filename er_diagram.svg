<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" width="980" height="550">

  <defs>
    <style>
      .tbl-bg { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .tbl-header-bg { fill: #f8f9fa; stroke: #000000; stroke-width: 1.2; }
      .tbl-header-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .grid-line { stroke: #000000; stroke-width: 0.9; }
      .col-k { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .col-n { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #111111; }
      .col-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #333333; }
      .edge { stroke: #000000; stroke-width: 1.5; fill: none; }
      .cf-marker { stroke: #000000; stroke-width: 1.5; fill: none; }
      .cf-circle { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Table: propellants -->
  <g id="tbl_propellants">
    <rect class="tbl-bg" x="50" y="30" width="380" height="318" />
    <rect class="tbl-header-bg" x="50" y="30" width="380" height="30" />
    <text class="tbl-header-txt" x="240" y="50">propellants</text>
    <line class="grid-line" x1="50" y1="60" x2="430" y2="60" />
    <line class="grid-line" x1="100" y1="60" x2="100" y2="348" />
    <line class="grid-line" x1="290" y1="60" x2="290" y2="348" />
    <text class="col-k" x="75" y="76">PK</text>
    <text class="col-n" x="108" y="76">id</text>
    <text class="col-t" x="298" y="76">INTEGER</text>
    <text class="col-n" x="108" y="100">name</text>
    <text class="col-t" x="298" y="100">VARCHAR(128)</text>
    <text class="col-k" x="75" y="124">N</text>
    <text class="col-n" x="108" y="124">short_description</text>
    <text class="col-t" x="298" y="124">VARCHAR(255)</text>
    <text class="col-k" x="75" y="148">N</text>
    <text class="col-n" x="108" y="148">engineering_analysis</text>
    <text class="col-t" x="298" y="148">TEXT</text>
    <text class="col-n" x="108" y="172">status</text>
    <text class="col-t" x="298" y="172">VARCHAR(32)</text>
    <text class="col-k" x="75" y="196">N</text>
    <text class="col-n" x="108" y="196">image_url</text>
    <text class="col-t" x="298" y="196">VARCHAR(255)</text>
    <text class="col-k" x="75" y="220">N</text>
    <text class="col-n" x="108" y="220">video_url</text>
    <text class="col-t" x="298" y="220">VARCHAR(255)</text>
    <text class="col-n" x="108" y="244">molar_mass</text>
    <text class="col-t" x="298" y="244">DECIMAL(8,3)</text>
    <text class="col-n" x="108" y="268">specific_heat_ratio</text>
    <text class="col-t" x="298" y="268">DECIMAL(8,3)</text>
    <text class="col-k" x="75" y="292">FK</text>
    <text class="col-n" x="108" y="292">creator_id</text>
    <text class="col-t" x="298" y="292">INTEGER</text>
    <text class="col-n" x="108" y="316">created_at</text>
    <text class="col-t" x="298" y="316">TIMESTAMP</text>
    <text class="col-n" x="108" y="340">updated_at</text>
    <text class="col-t" x="298" y="340">TIMESTAMP</text>
  </g>
  <!-- Table: users -->
  <g id="tbl_users">
    <rect class="tbl-bg" x="560" y="50" width="360" height="150" />
    <rect class="tbl-header-bg" x="560" y="50" width="360" height="30" />
    <text class="tbl-header-txt" x="740" y="70">users</text>
    <line class="grid-line" x1="560" y1="80" x2="920" y2="80" />
    <line class="grid-line" x1="610" y1="80" x2="610" y2="200" />
    <line class="grid-line" x1="790" y1="80" x2="790" y2="200" />
    <text class="col-k" x="585" y="96">PK</text>
    <text class="col-n" x="618" y="96">id</text>
    <text class="col-t" x="798" y="96">INTEGER</text>
    <text class="col-n" x="618" y="120">username</text>
    <text class="col-t" x="798" y="120">VARCHAR(64)</text>
    <text class="col-n" x="618" y="144">password</text>
    <text class="col-t" x="798" y="144">VARCHAR(255)</text>
    <text class="col-n" x="618" y="168">email</text>
    <text class="col-t" x="798" y="168">VARCHAR(128)</text>
    <text class="col-n" x="618" y="192">created_at</text>
    <text class="col-t" x="798" y="192">TIMESTAMP</text>
  </g>
  <!-- Table: propellant_likes -->
  <g id="tbl_likes">
    <rect class="tbl-bg" x="50" y="400" width="380" height="126" />
    <rect class="tbl-header-bg" x="50" y="400" width="380" height="30" />
    <text class="tbl-header-txt" x="240" y="420">propellant_likes</text>
    <line class="grid-line" x1="50" y1="430" x2="430" y2="430" />
    <line class="grid-line" x1="100" y1="430" x2="100" y2="526" />
    <line class="grid-line" x1="290" y1="430" x2="290" y2="526" />
    <text class="col-k" x="75" y="446">PK</text>
    <text class="col-n" x="108" y="446">id</text>
    <text class="col-t" x="298" y="446">INTEGER</text>
    <text class="col-k" x="75" y="470">FK</text>
    <text class="col-n" x="108" y="470">user_id</text>
    <text class="col-t" x="298" y="470">INTEGER</text>
    <text class="col-k" x="75" y="494">FK</text>
    <text class="col-n" x="108" y="494">propellant_id</text>
    <text class="col-t" x="298" y="494">INTEGER</text>
    <text class="col-n" x="108" y="518">created_at</text>
    <text class="col-t" x="298" y="518">TIMESTAMP</text>
  </g>
  <!-- ==================== RELATIONSHIPS ==================== -->
  <!-- 1. users -> propellants -->
  <path class="edge" d="M 560 92 L 495 92 L 495 288 L 430 288" />
  <line class="cf-marker" x1="548" y1="85" x2="548" y2="99" />
  <line class="cf-marker" x1="554" y1="85" x2="554" y2="99" />
  <circle class="cf-circle" cx="448" cy="288" r="4.5" />
  <path class="cf-marker" d="M 442 288 L 430 281 M 442 288 L 430 295 M 442 288 L 430 288" />
  <!-- 2. propellants -> propellant_likes -->
  <path class="edge" d="M 160 348 L 160 400" />
  <line class="cf-marker" x1="153" y1="358" x2="167" y2="358" />
  <line class="cf-marker" x1="153" y1="364" x2="167" y2="364" />
  <circle class="cf-circle" cx="160" cy="390" r="4.5" />
  <path class="cf-marker" d="M 160 394 L 153 400 M 160 394 L 167 400 M 160 394 L 160 400" />
  <!-- 3. users -> propellant_likes -->
  <path class="edge" d="M 740 200 L 740 466 L 430 466" />
  <line class="cf-marker" x1="733" y1="212" x2="747" y2="212" />
  <line class="cf-marker" x1="733" y1="218" x2="747" y2="218" />
  <circle class="cf-circle" cx="448" cy="466" r="4.5" />
  <path class="cf-marker" d="M 442 466 L 430 459 M 442 466 L 430 473 M 442 466 L 430 466" />
</svg>
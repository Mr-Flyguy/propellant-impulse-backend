<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620">
  <defs>
    <style>
      .tbl-bg { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .tbl-header-bg { fill: #f8f9fa; stroke: #000000; stroke-width: 1.2; }
      .tbl-header-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .div-line { stroke: #000000; stroke-width: 1; }
      .col-k { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .col-k-plain { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #111111; text-anchor: middle; }
      .col-n { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #111111; }
      .col-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #333333; }
      .edge { stroke: #000000; stroke-width: 1.5; fill: none; }
      .cf-marker { stroke: #000000; stroke-width: 1.5; fill: none; }
      .cf-circle { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Pure White Background -->
  <rect width="980" height="620" fill="#ffffff" />

  <!-- ==================== TABLE 1: propellants ==================== -->
  <g id="tbl_propellants">
    <!-- Outer Box -->
    <rect class="tbl-bg" x="50" y="30" width="380" height="388" />
    <!-- Header -->
    <rect class="tbl-header-bg" x="50" y="30" width="380" height="28" />
    <text class="tbl-header-txt" x="240" y="49">Рабочие тела (propellants)</text>
    <line class="div-line" x1="50" y1="58" x2="430" y2="58" />

    <!-- Vertical Column Dividers in Body -->
    <line class="div-line" x1="100" y1="58" x2="100" y2="418" />
    <line class="div-line" x1="290" y1="58" x2="290" y2="418" />

    <!-- Rows (15 items, h=24 each, text baseline = y + 16) -->
    <!-- 1: id -->
    <text class="col-k" x="75" y="74">PK</text>
    <text class="col-n" x="108" y="74">id_тела (id)</text>
    <text class="col-t" x="298" y="74">INTEGER</text>

    <!-- 2: name -->
    <text class="col-n" x="108" y="98">Наименование</text>
    <text class="col-t" x="298" y="98">VARCHAR(128)</text>

    <!-- 3: chemical_formula (N) -->
    <text class="col-k" x="75" y="122">N</text>
    <text class="col-n" x="108" y="122">Химическая формула</text>
    <text class="col-t" x="298" y="122">VARCHAR(32)</text>

    <!-- 4: short_description (N) -->
    <text class="col-k" x="75" y="146">N</text>
    <text class="col-n" x="108" y="146">Краткое описание</text>
    <text class="col-t" x="298" y="146">VARCHAR(255)</text>

    <!-- 5: engineering_analysis (N) -->
    <text class="col-k" x="75" y="170">N</text>
    <text class="col-n" x="108" y="170">Инженерный анализ</text>
    <text class="col-t" x="298" y="170">TEXT</text>

    <!-- 6: status -->
    <text class="col-n" x="108" y="194">Статус (soft delete)</text>
    <text class="col-t" x="298" y="194">VARCHAR(32)</text>

    <!-- 7: image_url -->
    <text class="col-n" x="108" y="218">URL изображения</text>
    <text class="col-t" x="298" y="218">VARCHAR(255)</text>

    <!-- 8: video_url -->
    <text class="col-n" x="108" y="242">URL видео</text>
    <text class="col-t" x="298" y="242">VARCHAR(255)</text>

    <!-- 9: molar_mass -->
    <text class="col-n" x="108" y="266">Молярная масса (M)</text>
    <text class="col-t" x="298" y="266">DECIMAL(8,3)</text>

    <!-- 10: specific_impulse -->
    <text class="col-n" x="108" y="290">Удельный импульс (Isp)</text>
    <text class="col-t" x="298" y="290">INTEGER</text>

    <!-- 11: reactor_temperature_k -->
    <text class="col-n" x="108" y="314">Температура реактора</text>
    <text class="col-t" x="298" y="314">INTEGER</text>

    <!-- 12: specific_heat_ratio -->
    <text class="col-n" x="108" y="338">Показатель адиабаты</text>
    <text class="col-t" x="298" y="338">DECIMAL(8,3)</text>

    <!-- 13: creator_id (FK) -->
    <text class="col-k" x="75" y="362">FK</text>
    <text class="col-n" x="108" y="362">id_создателя (creator_id)</text>
    <text class="col-t" x="298" y="362">INTEGER</text>

    <!-- 14: created_at -->
    <text class="col-n" x="108" y="386">Дата создания</text>
    <text class="col-t" x="298" y="386">DATETIME</text>

    <!-- 15: updated_at (N) -->
    <text class="col-k" x="75" y="410">N</text>
    <text class="col-n" x="108" y="410">Дата обновления</text>
    <text class="col-t" x="298" y="410">DATETIME</text>
  </g>

  <!-- ==================== TABLE 2: users ==================== -->
  <g id="tbl_users">
    <!-- Outer Box -->
    <rect class="tbl-bg" x="560" y="90" width="360" height="148" />
    <!-- Header -->
    <rect class="tbl-header-bg" x="560" y="90" width="360" height="28" />
    <text class="tbl-header-txt" x="740" y="109">Пользователи (users)</text>
    <line class="div-line" x1="560" y1="118" x2="920" y2="118" />

    <!-- Vertical Column Dividers in Body -->
    <line class="div-line" x1="610" y1="118" x2="610" y2="238" />
    <line class="div-line" x1="790" y1="118" x2="790" y2="238" />

    <!-- Rows (5 items, h=24 each) -->
    <!-- 1: id (PK) -->
    <text class="col-k" x="585" y="134">PK</text>
    <text class="col-n" x="618" y="134">id_пользователя (id)</text>
    <text class="col-t" x="798" y="134">INTEGER</text>

    <!-- 2: username (U) -->
    <text class="col-k" x="585" y="158">U</text>
    <text class="col-n" x="618" y="158">Логин (username)</text>
    <text class="col-t" x="798" y="158">VARCHAR(64)</text>

    <!-- 3: password -->
    <text class="col-n" x="618" y="182">Пароль (password)</text>
    <text class="col-t" x="798" y="182">VARCHAR(128)</text>

    <!-- 4: email (U) -->
    <text class="col-k" x="585" y="206">U</text>
    <text class="col-n" x="618" y="206">Email</text>
    <text class="col-t" x="798" y="206">VARCHAR(128)</text>

    <!-- 5: created_at -->
    <text class="col-n" x="618" y="230">Дата регистрации</text>
    <text class="col-t" x="798" y="230">DATETIME</text>
  </g>

  <!-- ==================== TABLE 3: propellant_likes ==================== -->
  <g id="tbl_likes">
    <!-- Outer Box -->
    <rect class="tbl-bg" x="50" y="470" width="380" height="100" />
    <!-- Header -->
    <rect class="tbl-header-bg" x="50" y="470" width="380" height="28" />
    <text class="tbl-header-txt" x="240" y="489">Лайки (propellant_likes)</text>
    <line class="div-line" x1="50" y1="498" x2="430" y2="498" />

    <!-- Vertical Column Dividers in Body -->
    <line class="div-line" x1="115" y1="498" x2="115" y2="570" />
    <line class="div-line" x1="290" y1="498" x2="290" y2="570" />

    <!-- Rows (3 items, h=24 each) -->
    <!-- 1: user_id (PK,FK) -->
    <text class="col-k" x="82" y="514">PK,FK</text>
    <text class="col-n" x="123" y="514">id_пользователя</text>
    <text class="col-t" x="298" y="514">INTEGER</text>

    <!-- 2: propellant_id (PK,FK) -->
    <text class="col-k" x="82" y="538">PK,FK</text>
    <text class="col-n" x="123" y="538">id_рабочего_тела</text>
    <text class="col-t" x="298" y="538">INTEGER</text>

    <!-- 3: created_at -->
    <text class="col-n" x="123" y="562">Дата отметки</text>
    <text class="col-t" x="298" y="562">DATETIME</text>
  </g>

  <!-- ==================== RELATIONSHIPS (CROW'S FOOT) ==================== -->
  <!-- 1. users -> propellants (creator_id) -->
  <!-- From users left side (x=560, y=134) to propellants right side at creator_id row (x=430, y=358) -->
  <path class="edge" d="M 560 134 L 490 134 L 490 358 L 430 358" />
  <!-- Crow's foot at users (Mandatory One: ||) -->
  <line class="cf-marker" x1="548" y1="127" x2="548" y2="141" />
  <line class="cf-marker" x1="554" y1="127" x2="554" y2="141" />
  <!-- Crow's foot at propellants (Zero or Many: o<) -->
  <circle class="cf-circle" cx="448" cy="358" r="4.5" />
  <path class="cf-marker" d="M 442 358 L 430 351 M 442 358 L 430 365 M 442 358 L 430 358" />

  <!-- 2. propellants -> propellant_likes (propellant_id) -->
  <!-- Directly down from propellants bottom (x=160, y=418) to propellant_likes top (x=160, y=470) -->
  <path class="edge" d="M 160 418 L 160 470" />
  <!-- Mandatory One at propellants: || -->
  <line class="cf-marker" x1="153" y1="430" x2="167" y2="430" />
  <line class="cf-marker" x1="153" y1="436" x2="167" y2="436" />
  <!-- Zero or Many at propellant_likes: o< (downwards) -->
  <circle class="cf-circle" cx="160" cy="452" r="4.5" />
  <path class="cf-marker" d="M 160 458 L 153 470 M 160 458 L 167 470 M 160 458 L 160 470" />

  <!-- 3. users -> propellant_likes (user_id) -->
  <!-- From users bottom (x=740, y=238) down to y=520, then left to propellant_likes right (x=430, y=520) -->
  <path class="edge" d="M 740 238 L 740 520 L 430 520" />
  <!-- Mandatory One at users: || -->
  <line class="cf-marker" x1="733" y1="250" x2="747" y2="250" />
  <line class="cf-marker" x1="733" y1="256" x2="747" y2="256" />
  <!-- Zero or Many at propellant_likes: o< -->
  <circle class="cf-circle" cx="448" cy="520" r="4.5" />
  <path class="cf-marker" d="M 442 520 L 430 513 M 442 520 L 430 527 M 442 520 L 430 520" />

</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 550" width="980" height="550">

  <defs>
    <style>
      .tbl-bg { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .tbl-header-bg { fill: #f8f9fa; stroke: #000000; stroke-width: 1.2; }
      .tbl-header-txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .grid-line { stroke: #000000; stroke-width: 0.9; }
      .col-k { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #111111; text-anchor: middle; }
      .col-n { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #111111; }
      .col-t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #333333; }
      .edge { stroke: #000000; stroke-width: 1.5; fill: none; }
      .cf-marker { stroke: #000000; stroke-width: 1.5; fill: none; }
      .cf-circle { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Table: propellants -->
  <g id="tbl_propellants">
    <rect class="tbl-bg" x="50" y="30" width="380" height="316" />
    <rect class="tbl-header-bg" x="50" y="30" width="380" height="28" />
    <text class="tbl-header-txt" x="240" y="49">propellants</text>
    <line class="grid-line" x1="50" y1="58" x2="430" y2="58" />
    <line class="grid-line" x1="100" y1="58" x2="100" y2="346" />
    <line class="grid-line" x1="290" y1="58" x2="290" y2="346" />
    <text class="col-k" x="75" y="74">PK</text>
    <text class="col-n" x="108" y="74">id</text>
    <text class="col-t" x="298" y="74">INTEGER</text>
    <text class="col-n" x="108" y="98">name</text>
    <text class="col-t" x="298" y="98">VARCHAR(128)</text>
    <text class="col-k" x="75" y="122">N</text>
    <text class="col-n" x="108" y="122">short_description</text>
    <text class="col-t" x="298" y="122">VARCHAR(255)</text>
    <text class="col-k" x="75" y="146">N</text>
    <text class="col-n" x="108" y="146">engineering_analysis</text>
    <text class="col-t" x="298" y="146">TEXT</text>
    <text class="col-n" x="108" y="170">status</text>
    <text class="col-t" x="298" y="170">VARCHAR(32)</text>
    <text class="col-k" x="75" y="194">N</text>
    <text class="col-n" x="108" y="194">image_url</text>
    <text class="col-t" x="298" y="194">VARCHAR(255)</text>
    <text class="col-k" x="75" y="218">N</text>
    <text class="col-n" x="108" y="218">video_url</text>
    <text class="col-t" x="298" y="218">VARCHAR(255)</text>
    <text class="col-n" x="108" y="242">molar_mass</text>
    <text class="col-t" x="298" y="242">DECIMAL(8,3)</text>
    <text class="col-n" x="108" y="266">specific_heat_ratio</text>
    <text class="col-t" x="298" y="266">DECIMAL(8,3)</text>
    <text class="col-k" x="75" y="290">FK</text>
    <text class="col-n" x="108" y="290">creator_id</text>
    <text class="col-t" x="298" y="290">INTEGER</text>
    <text class="col-n" x="108" y="314">created_at</text>
    <text class="col-t" x="298" y="314">TIMESTAMP</text>
    <text class="col-n" x="108" y="338">updated_at</text>
    <text class="col-t" x="298" y="338">TIMESTAMP</text>
  </g>
  <!-- Table: users -->
  <g id="tbl_users">
    <rect class="tbl-bg" x="560" y="50" width="360" height="148" />
    <rect class="tbl-header-bg" x="560" y="50" width="360" height="28" />
    <text class="tbl-header-txt" x="740" y="69">users</text>
    <line class="grid-line" x1="560" y1="78" x2="920" y2="78" />
    <line class="grid-line" x1="610" y1="78" x2="610" y2="198" />
    <line class="grid-line" x1="790" y1="78" x2="790" y2="198" />
    <text class="col-k" x="585" y="94">PK</text>
    <text class="col-n" x="618" y="94">id</text>
    <text class="col-t" x="798" y="94">INTEGER</text>
    <text class="col-n" x="618" y="118">username</text>
    <text class="col-t" x="798" y="118">VARCHAR(64)</text>
    <text class="col-n" x="618" y="142">password</text>
    <text class="col-t" x="798" y="142">VARCHAR(255)</text>
    <text class="col-n" x="618" y="166">email</text>
    <text class="col-t" x="798" y="166">VARCHAR(128)</text>
    <text class="col-n" x="618" y="190">created_at</text>
    <text class="col-t" x="798" y="190">TIMESTAMP</text>
  </g>
  <!-- Table: propellant_likes -->
  <g id="tbl_likes">
    <rect class="tbl-bg" x="50" y="400" width="380" height="124" />
    <rect class="tbl-header-bg" x="50" y="400" width="380" height="28" />
    <text class="tbl-header-txt" x="240" y="419">propellant_likes</text>
    <line class="grid-line" x1="50" y1="428" x2="430" y2="428" />
    <line class="grid-line" x1="100" y1="428" x2="100" y2="524" />
    <line class="grid-line" x1="290" y1="428" x2="290" y2="524" />
    <text class="col-k" x="75" y="444">PK</text>
    <text class="col-n" x="108" y="444">id</text>
    <text class="col-t" x="298" y="444">INTEGER</text>
    <text class="col-k" x="75" y="468">FK</text>
    <text class="col-n" x="108" y="468">user_id</text>
    <text class="col-t" x="298" y="468">INTEGER</text>
    <text class="col-k" x="75" y="492">FK</text>
    <text class="col-n" x="108" y="492">propellant_id</text>
    <text class="col-t" x="298" y="492">INTEGER</text>
    <text class="col-n" x="108" y="516">created_at</text>
    <text class="col-t" x="298" y="516">TIMESTAMP</text>
  </g>
  <!-- ==================== RELATIONSHIPS ==================== -->
  <!-- 1. users -> propellants -->
  <path class="edge" d="M 560 90 L 495 90 L 495 286 L 430 286" />
  <line class="cf-marker" x1="548" y1="83" x2="548" y2="97" />
  <line class="cf-marker" x1="554" y1="83" x2="554" y2="97" />
  <circle class="cf-circle" cx="448" cy="286" r="4.5" />
  <path class="cf-marker" d="M 442 286 L 430 279 M 442 286 L 430 293 M 442 286 L 430 286" />
  <!-- 2. propellants -> propellant_likes -->
  <path class="edge" d="M 160 346 L 160 400" />
  <line class="cf-marker" x1="153" y1="356" x2="167" y2="356" />
  <line class="cf-marker" x1="153" y1="362" x2="167" y2="362" />
  <circle class="cf-circle" cx="160" cy="390" r="4.5" />
  <path class="cf-marker" d="M 160 394 L 153 400 M 160 394 L 167 400 M 160 394 L 160 400" />
  <!-- 3. users -> propellant_likes -->
  <path class="edge" d="M 740 198 L 740 464 L 430 464" />
  <line class="cf-marker" x1="733" y1="210" x2="747" y2="210" />
  <line class="cf-marker" x1="733" y1="216" x2="747" y2="216" />
  <circle class="cf-circle" cx="448" cy="464" r="4.5" />
  <path class="cf-marker" d="M 442 464 L 430 457 M 442 464 L 430 471 M 442 464 L 430 464" />
</svg>
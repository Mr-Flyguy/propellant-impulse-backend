<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 980" width="1020" height="980">
  <defs>
    <style>
      .label-txt { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11px; fill: #000000; text-anchor: middle; }
      .label-bold { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11.5px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .domain-txt { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; fill: #000000; text-anchor: middle; }
      .msg-text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11px; fill: #000000; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .msg-text-center { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11px; fill: #000000; text-anchor: middle; paint-order: stroke fill; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .frame-text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; font-size: 11px; font-weight: bold; fill: #000000; }

      .box-frame { fill: #ffffff; stroke: #000000; stroke-width: 1.2; }
      .stem-line { stroke: #000000; stroke-width: 1.0; stroke-dasharray: 4,4; }
      .activation-bar { fill: #ffffff; stroke: #000000; stroke-width: 1.0; }
      .msg-solid { stroke: #000000; stroke-width: 1.0; fill: none; }
      .msg-dash { stroke: #000000; stroke-width: 1.0; stroke-dasharray: 4,3; fill: none; }
      .component-box { fill: #ffffff; stroke: #000000; stroke-width: 1.1; }
    </style>
    
    <!-- Solid triangular arrowhead for calls -->
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <!-- Open arrowhead for returns and create -->
    <marker id="arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 2 L 9 5 L 1 8" fill="none" stroke="#000000" stroke-width="1.1" />
    </marker>
  </defs>

  <rect width="1020" height="980" fill="#ffffff" />

  <!-- ==================== OUTER FRAME (interaction HTTP запросы) ==================== -->
  <rect class="box-frame" x="4" y="4" width="1012" height="972" />
  <path d="M 4,4 L 190,4 L 190,16 L 175,26 L 4,26 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text class="frame-text" x="9" y="18">interaction HTTP запросы</text>

  <!-- ==================== LIFELINES ====================
       X positions:
       1. Браузер: Веб-браузер: x = 175
       2. HTTP: HTTP-сервер :3000: x = 380
       3. : Домен пользователей: x = 540
       4. : Мобильное приложение: x = 695
       5. : Домен видов топлива: x = 790
       6. : PostgreSQL: x = 945
       React SPA box: x = 195..275 (center = 235), created at y = 190
  -->

  <!-- Dashed stems -->
  <line class="stem-line" x1="175" y1="110" x2="175" y2="950" />
  <line class="stem-line" x1="380" y1="110" x2="380" y2="950" />
  <line class="stem-line" x1="540" y1="110" x2="540" y2="950" />
  <line class="stem-line" x1="695" y1="110" x2="695" y2="950" />
  <line class="stem-line" x1="790" y1="110" x2="790" y2="950" />
  <line class="stem-line" x1="945" y1="110" x2="945" y2="950" />

  <!-- React stem (starts after create at y=248) -->
  <line class="stem-line" x1="235" y1="248" x2="235" y2="950" />


  <!-- ==================== LIFELINE HEADERS ==================== -->
  <!-- 1. Браузер: Веб-браузер (Component) -->
  <g id="header_browser">
    <!-- Component icon at cx=175, cy=70 -->
    <rect class="component-box" x="163" y="55" width="24" height="32" />
    <rect class="component-box" x="157" y="61" width="10" height="6" />
    <rect class="component-box" x="157" y="73" width="10" height="6" />
    <text class="label-bold" x="175" y="103">Браузер: Веб-браузер</text>
  </g>

  <!-- 2. HTTP: HTTP-сервер :3000 (Component) -->
  <g id="header_server">
    <rect class="component-box" x="368" y="55" width="24" height="32" />
    <rect class="component-box" x="362" y="61" width="10" height="6" />
    <rect class="component-box" x="362" y="73" width="10" height="6" />
    <text class="label-bold" x="380" y="103">HTTP: HTTP-сервер :3000</text>
  </g>

  <!-- 3. : Домен пользователей (Domain Box) -->
  <g id="header_domain_users">
    <rect class="box-frame" x="470" y="54" width="140" height="38" />
    <text class="domain-txt" x="540" y="71">: Домен</text>
    <text class="domain-txt" x="540" y="85">пользователей</text>
  </g>

  <!-- 4. : Мобильное приложение (Component) -->
  <g id="header_mobile">
    <rect class="component-box" x="683" y="55" width="24" height="32" />
    <rect class="component-box" x="677" y="61" width="10" height="6" />
    <rect class="component-box" x="677" y="73" width="10" height="6" />
    <text class="label-bold" x="695" y="97">: Мобильное</text>
    <text class="label-bold" x="695" y="109">приложение</text>
  </g>

  <!-- 5. : Домен видов топлива (Domain Box) -->
  <g id="header_domain_propellants">
    <rect class="box-frame" x="735" y="54" width="130" height="38" />
    <text class="domain-txt" x="800" y="71">: Домен</text>
    <text class="domain-txt" x="800" y="85">видов топлива</text>
  </g>

  <!-- 6. : PostgreSQL (Component) -->
  <g id="header_postgres">
    <rect class="component-box" x="933" y="55" width="24" height="32" />
    <rect class="component-box" x="927" y="61" width="10" height="6" />
    <rect class="component-box" x="927" y="73" width="10" height="6" />
    <text class="label-bold" x="945" y="103">: PostgreSQL</text>
  </g>


  <!-- ==================== MESSAGES & ACTIVATION BARS ==================== -->

  <!-- 1 : GET (from Browser x=175 to Server x=374) -->
  <!-- Y=140 -->
  <text class="msg-text-center" x="277" y="135">1 : GET</text>
  <line class="msg-solid" x1="175" y1="140" x2="374" y2="140" marker-end="url(#arrow-solid)" />
  <!-- Activation on Server (y=140..220) -->
  <rect class="activation-bar" x="374" y="140" width="12" height="80" />

  <!-- 2 : «create» (from Server x=374 to React box x=275) -->
  <!-- Y=190 -->
  <text class="msg-text-center" x="325" y="177">2 :</text>
  <text class="msg-text-center" x="325" y="190">«create»</text>
  <line class="msg-dash" x1="374" y1="195" x2="276" y2="195" marker-end="url(#arrow-open)" />

  <!-- React box (w:80, h:40, center=235, x=195..275, y=185..225) -->
  <rect class="box-frame" x="195" y="180" width="80" height="40" />
  <text class="label-bold" x="235" y="205" style="font-size:12px;">React</text>


  <!-- ==================== OPERATION 1: POST UserLogin() ==================== -->
  <!-- Y=255: React -> Домен пользователей (x=235 to 534) -->
  <text class="msg-text" x="310" y="250">3 : POST UserLogin()</text>
  <line class="msg-solid" x1="235" y1="255" x2="534" y2="255" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="534" y="255" width="12" height="40" />

  <!-- Return 4: JSON пользователя и Cookie sessionId (x=534 to 235) -->
  <text class="msg-text" x="280" y="290">4 : JSON пользователя и Cookie sessionId</text>
  <line class="msg-dash" x1="534" y1="295" x2="235" y2="295" marker-end="url(#arrow-open)" />


  <!-- ==================== OPERATION 2: GET Propellants(maxMolarMass) ==================== -->
  <!-- Y=330: React -> Домен видов топлива (x=235 to 794) -->
  <text class="msg-text" x="340" y="325">5 : GET Propellants(maxMolarMass)</text>
  <line class="msg-solid" x1="235" y1="330" x2="794" y2="330" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="794" y="330" width="12" height="40" />

  <!-- Return 6: JSON рабочих тел (x=794 to 235) -->
  <text class="msg-text" x="340" y="365">6 : JSON рабочих тел</text>
  <line class="msg-dash" x1="794" y1="370" x2="235" y2="370" marker-end="url(#arrow-open)" />


  <!-- ==================== OPERATION 3: GET PropellantDraft() ==================== -->
  <!-- Y=405: React -> Домен видов топлива (x=235 to 794) -->
  <text class="msg-text" x="340" y="400">7 : GET PropellantDraft()</text>
  <line class="msg-solid" x1="235" y1="405" x2="794" y2="405" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="794" y="405" width="12" height="40" />

  <!-- Return 8: JSON полей черновика (x=794 to 235) -->
  <text class="msg-text" x="340" y="440">8 : JSON полей черновика</text>
  <line class="msg-dash" x1="794" y1="445" x2="235" y2="445" marker-end="url(#arrow-open)" />


  <!-- ==================== OPERATION 4: POST Propellant(name, image, video) ==================== -->
  <!-- Y=480: React -> Домен видов топлива (x=235 to 794) -->
  <text class="msg-text" x="310" y="475">9 : POST Propellant(name, image, video)</text>
  <line class="msg-solid" x1="235" y1="480" x2="794" y2="480" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="794" y="480" width="12" height="40" />

  <!-- Return 10: 201 : JSON черновика (x=794 to 235) -->
  <text class="msg-text" x="340" y="515">10 : 201 : JSON черновика</text>
  <line class="msg-dash" x1="794" y1="520" x2="235" y2="520" marker-end="url(#arrow-open)" />


  <!-- ==================== OPERATION 5: PUT Propellant(id) + DB QUERIES ==================== -->
  <!-- Y=555: React -> Домен видов топлива (x=235 to 794) -->
  <text class="msg-text" x="340" y="550">11 : PUT Propellant(id)</text>
  <line class="msg-solid" x1="235" y1="555" x2="794" y2="555" marker-end="url(#arrow-solid)" />
  <!-- Long activation on Domain (y=555..680) -->
  <rect class="activation-bar" x="794" y="555" width="12" height="125" />

  <!-- Internal DB call: 12 : select propellants (x=806 to 939) -->
  <text class="msg-text" x="815" y="570">12 : select propellants</text>
  <line class="msg-solid" x1="806" y1="575" x2="939" y2="575" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="939" y="575" width="12" height="35" />

  <!-- DB return: 13 : курсор рабочего тела (x=939 to 806) -->
  <text class="msg-text" x="815" y="605">13 : курсор рабочего тела</text>
  <line class="msg-dash" x1="939" y1="610" x2="806" y2="610" marker-end="url(#arrow-open)" />

  <!-- Internal DB call: 14 : update propellants (x=806 to 939) -->
  <text class="msg-text" x="815" y="630">14 : update propellants</text>
  <line class="msg-solid" x1="806" y1="635" x2="939" y2="635" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="939" y="635" width="12" height="35" />

  <!-- DB return: 15 : статус обновления (x=939 to 806) -->
  <text class="msg-text" x="815" y="665">15 : статус обновления</text>
  <line class="msg-dash" x1="939" y1="670" x2="806" y2="670" marker-end="url(#arrow-open)" />

  <!-- Return 16: JSON измененного рабочего тела (x=794 to 235) -->
  <text class="msg-text" x="340" y="675">16 : JSON обновленного рабочего тела</text>
  <line class="msg-dash" x1="794" y1="680" x2="235" y2="680" marker-end="url(#arrow-open)" />


  <!-- ==================== OPERATION 6: POST PropellantLike(id, like) ==================== -->
  <!-- Y=715: React -> Домен видов топлива (x=235 to 794) -->
  <text class="msg-text" x="330" y="710">17 : POST PropellantLike(id, like)</text>
  <line class="msg-solid" x1="235" y1="715" x2="794" y2="715" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="794" y="715" width="12" height="40" />

  <!-- Return 18: JSON отметки нравится (x=794 to 235) -->
  <text class="msg-text" x="340" y="750">18 : JSON отметки нравится</text>
  <line class="msg-dash" x1="794" y1="755" x2="235" y2="755" marker-end="url(#arrow-open)" />


  <!-- ==================== OPERATION 7: DELETE Propellant(id) ==================== -->
  <!-- Y=790: React -> Домен видов топлива (x=235 to 794) -->
  <text class="msg-text" x="340" y="785">19 : DELETE Propellant(id)</text>
  <line class="msg-solid" x1="235" y1="790" x2="794" y2="790" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="794" y="790" width="12" height="40" />

  <!-- Return 20: 200 : OK (x=794 to 235) -->
  <text class="msg-text" x="340" y="825">20 : 200 : OK</text>
  <line class="msg-dash" x1="794" y1="830" x2="235" y2="830" marker-end="url(#arrow-open)" />


  <!-- ==================== OPERATION 8: GET PropellantFeed (FROM MOBILE CLIENT) ==================== -->
  <!-- Exactly as in Image 2 lines 15 & 16: Mobile -> Domain -> DB -> Mobile -->
  <!-- Y=865: Mobile (x=695) -> Домен видов топлива (x=794) -->
  <text class="msg-text" x="655" y="860">21 : GET PropellantFeed(id, next)</text>
  <line class="msg-solid" x1="695" y1="865" x2="794" y2="865" marker-end="url(#arrow-solid)" />
  <!-- Activation on Domain (y=865..935) -->
  <rect class="activation-bar" x="794" y="865" width="12" height="70" />

  <!-- Internal DB call: 22 : select next propellant (x=806 to 939) -->
  <text class="msg-text" x="815" y="880">22 : select feed_propellant</text>
  <line class="msg-solid" x1="806" y1="885" x2="939" y2="885" marker-end="url(#arrow-solid)" />
  <rect class="activation-bar" x="939" y="885" width="12" height="30" />

  <!-- DB return: 23 : курсор ленты (x=939 to 806) -->
  <text class="msg-text" x="815" y="910">23 : курсор ленты</text>
  <line class="msg-dash" x1="939" y1="915" x2="806" y2="915" marker-end="url(#arrow-open)" />

  <!-- Return 24: JSON карточки для ленты (x=794 to 695) -->
  <text class="msg-text" x="660" y="930">24 : JSON карточки ленты</text>
  <line class="msg-dash" x1="794" y1="935" x2="695" y2="935" marker-end="url(#arrow-open)" />

</svg>

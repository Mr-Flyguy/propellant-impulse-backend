<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1140" width="1060" height="1140" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111" />
    </marker>
    <marker id="async-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 2 L 9 5 L 0 8" fill="none" stroke="#111111" stroke-width="1.5" />
    </marker>
    <marker id="reply-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 2 L 9 5 L 0 8" fill="none" stroke="#333333" stroke-width="1.3" />
    </marker>
  </defs>

  <style>
    .title-box { fill: #ffffff; stroke: #222222; stroke-width: 1.2; }
    .title-txt { font-size: 13px; font-weight: bold; fill: #111111; }
    .lifeline-box { fill: #ffffff; stroke: #222222; stroke-width: 1.2; }
    .lifeline-stem { stroke: #555555; stroke-width: 1; stroke-dasharray: 4,4; }
    .ll-title { font-size: 12px; font-weight: bold; fill: #111111; text-anchor: middle; }
    .react-box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
    .react-title { font-size: 13px; font-weight: bold; fill: #111111; text-anchor: middle; }
    .activation-bar { fill: #ffffff; stroke: #222222; stroke-width: 1.2; }
    .msg-synch { stroke: #111111; stroke-width: 1.3; }
    .msg-reply { stroke: #444444; stroke-width: 1.2; stroke-dasharray: 4,3; }
    .msg-lbl { font-size: 11px; fill: #111111; text-anchor: middle; }
    .msg-num { font-weight: bold; fill: #000000; }
    .component-icon { fill: #ffffff; stroke: #222222; stroke-width: 1.1; }
  </style>

  <!-- Interaction Frame Header -->
  <path d="M 10 10 L 260 10 L 275 28 L 1050 28 L 1050 1130 L 10 1130 Z" fill="none" stroke="#222222" stroke-width="1.2" />
  <text x="20" y="22" class="title-txt">sd Диаграмма последовательности</text>

  <!-- ==================== LIFELINES ==================== -->
  <!-- 1. Браузер: Веб-браузер (x = 140) -->
  <line x1="140" y1="92" x2="140" y2="1100" class="lifeline-stem" />
  <g id="ll_browser">
    <rect x="128" y="42" width="24" height="28" class="component-icon" />
    <rect x="123" y="47" width="9" height="5" class="component-icon" />
    <rect x="123" y="58" width="9" height="5" class="component-icon" />
    <text x="140" y="86" class="ll-title">Браузер: Веб-браузер</text>
  </g>

  <!-- 2. React (SPA) (x = 295, created at y = 145) -->
  <line x1="295" y1="185" x2="295" y2="1100" class="lifeline-stem" />
  <g id="ll_react">
    <rect x="250" y="145" width="90" height="40" class="react-box" />
    <text x="295" y="170" class="react-title">React</text>
  </g>

  <!-- 3. HTTP: HTTP-сервер :3000 (x = 455) -->
  <line x1="455" y1="92" x2="455" y2="1100" class="lifeline-stem" />
  <g id="ll_server">
    <rect x="443" y="42" width="24" height="28" class="component-icon" />
    <rect x="438" y="47" width="9" height="5" class="component-icon" />
    <rect x="438" y="58" width="9" height="5" class="component-icon" />
    <text x="455" y="86" class="ll-title">HTTP: HTTP-сервер :3000</text>
  </g>

  <!-- 4. : Домен пользователей (x = 670) -->
  <line x1="670" y1="92" x2="670" y2="1100" class="lifeline-stem" />
  <g id="ll_users">
    <rect x="580" y="50" width="180" height="40" class="lifeline-box" />
    <text x="670" y="75" class="ll-title">: Домен пользователей</text>
  </g>

  <!-- 5. : Домен видов топлива (x = 895) -->
  <line x1="895" y1="92" x2="895" y2="1100" class="lifeline-stem" />
  <g id="ll_propellants">
    <rect x="800" y="50" width="190" height="40" class="lifeline-box" />
    <text x="895" y="75" class="ll-title">: Домен видов топлива</text>
  </g>

  <!-- ==================== ACTIVATION BARS ==================== -->
  <!-- Server activation: 115 to 165 -->
  <rect x="448" y="115" width="14" height="50" class="activation-bar" />

  <!-- Users domain activation: 225 to 275 -->
  <rect x="663" y="225" width="14" height="50" class="activation-bar" />

  <!-- Propellants domain activations -->
  <rect x="888" y="335" width="14" height="50" class="activation-bar" />
  <rect x="888" y="445" width="14" height="50" class="activation-bar" />
  <rect x="888" y="555" width="14" height="50" class="activation-bar" />
  <rect x="888" y="665" width="14" height="50" class="activation-bar" />
  <rect x="888" y="775" width="14" height="50" class="activation-bar" />
  <rect x="888" y="885" width="14" height="50" class="activation-bar" />
  <rect x="888" y="995" width="14" height="50" class="activation-bar" />

  <!-- ==================== MESSAGES ==================== -->
  <!-- 1 : GET (Browser -> Server) -->
  <line x1="140" y1="115" x2="448" y2="115" class="msg-synch" marker-end="url(#arrow)" />
  <text x="295" y="107" class="msg-lbl"><tspan class="msg-num">1 : </tspan>GET</text>

  <!-- 2 : «create» (Server -> React) -->
  <line x1="448" y1="165" x2="340" y2="165" class="msg-reply" marker-end="url(#async-arrow)" />
  <text x="395" y="157" class="msg-lbl"><tspan class="msg-num">2 : </tspan>«create»</text>

  <!-- 3 : POST UserLogin(username, password) (React -> Users) -->
  <line x1="295" y1="225" x2="663" y2="225" class="msg-synch" marker-end="url(#arrow)" />
  <text x="480" y="217" class="msg-lbl"><tspan class="msg-num">3 : </tspan>POST UserLogin(username, password)</text>

  <!-- 4 : Reply (Users -> React) -->
  <line x1="663" y1="275" x2="295" y2="275" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="480" y="267" class="msg-lbl"><tspan class="msg-num">4 : </tspan>JSON пользователя и Cookie sessionId(sessionId, user)</text>

  <!-- 5 : GET Propellants(maxMolarMass) (React -> Propellants) -->
  <line x1="295" y1="335" x2="888" y2="335" class="msg-synch" marker-end="url(#arrow)" />
  <text x="590" y="327" class="msg-lbl"><tspan class="msg-num">5 : </tspan>GET Propellants(maxMolarMass)</text>

  <!-- 6 : Reply (Propellants -> React) -->
  <line x1="888" y1="385" x2="295" y2="385" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="590" y="377" class="msg-lbl"><tspan class="msg-num">6 : </tspan>JSON списка услуг(propellants[])</text>

  <!-- 7 : POST Propellant(name, image, video) (React -> Propellants) -->
  <line x1="295" y1="445" x2="888" y2="445" class="msg-synch" marker-end="url(#arrow)" />
  <text x="590" y="437" class="msg-lbl"><tspan class="msg-num">7 : </tspan>POST Propellant(name, image, video)</text>

  <!-- 8 : Reply (Propellants -> React) -->
  <line x1="888" y1="495" x2="295" y2="495" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="590" y="487" class="msg-lbl"><tspan class="msg-num">8 : </tspan>201 : JSON черновика(id, draft = true)</text>

  <!-- 9 : GET PropellantDraft() (React -> Propellants) -->
  <line x1="295" y1="555" x2="888" y2="555" class="msg-synch" marker-end="url(#arrow)" />
  <text x="590" y="547" class="msg-lbl"><tspan class="msg-num">9 : </tspan>GET PropellantDraft()</text>

  <!-- 10 : Reply (Propellants -> React) -->
  <line x1="888" y1="605" x2="295" y2="605" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="590" y="597" class="msg-lbl"><tspan class="msg-num">10 : </tspan>JSON полей черновика(draft_fields)</text>

  <!-- 11 : PUT Propellant(id) (React -> Propellants) -->
  <line x1="295" y1="665" x2="888" y2="665" class="msg-synch" marker-end="url(#arrow)" />
  <text x="590" y="657" class="msg-lbl"><tspan class="msg-num">11 : </tspan>PUT Propellant(id)</text>

  <!-- 12 : Reply (Propellants -> React) -->
  <line x1="888" y1="715" x2="295" y2="715" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="590" y="707" class="msg-lbl"><tspan class="msg-num">12 : </tspan>JSON опубликованной услуги(id, published = true)</text>

  <!-- 13 : GET PropellantFeed() (React -> Propellants) -->
  <line x1="295" y1="775" x2="888" y2="775" class="msg-synch" marker-end="url(#arrow)" />
  <text x="590" y="767" class="msg-lbl"><tspan class="msg-num">13 : </tspan>GET PropellantFeed()</text>

  <!-- 14 : Reply (Propellants -> React) -->
  <line x1="888" y1="825" x2="295" y2="825" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="590" y="817" class="msg-lbl"><tspan class="msg-num">14 : </tspan>JSON карточки ленты(feed_item)</text>

  <!-- 15 : GET PropellantFeed(id, next = true) (React -> Propellants) -->
  <line x1="295" y1="885" x2="888" y2="885" class="msg-synch" marker-end="url(#arrow)" />
  <text x="590" y="877" class="msg-lbl"><tspan class="msg-num">15 : </tspan>GET PropellantFeed(id, next = true)</text>

  <!-- 16 : Reply (Propellants -> React) -->
  <line x1="888" y1="935" x2="295" y2="935" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="590" y="927" class="msg-lbl"><tspan class="msg-num">16 : </tspan>JSON следующей карточки ленты(next_feed_item)</text>

  <!-- 17 : POST PropellantLike(id, like) (React -> Propellants) -->
  <line x1="295" y1="995" x2="888" y2="995" class="msg-synch" marker-end="url(#arrow)" />
  <text x="590" y="987" class="msg-lbl"><tspan class="msg-num">17 : </tspan>POST PropellantLike(id, like)</text>

  <!-- 18 : Reply (Propellants -> React) -->
  <line x1="888" y1="1045" x2="295" y2="1045" class="msg-reply" marker-end="url(#reply-arrow)" />
  <text x="590" y="1037" class="msg-lbl"><tspan class="msg-num">18 : </tspan>JSON отметки нравится(likesCount, isLiked)</text>

</svg>
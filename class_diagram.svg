<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860" width="920" height="860">

  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .pkg-title { font-size: 14px; font-weight: bold; fill: #111111; }
      .cls-title { font-size: 13px; font-weight: bold; fill: #111111; }
      .cls-title-2line { font-size: 12.5px; font-weight: bold; fill: #111111; }
      .method { font-family: "Consolas", "Courier New", monospace; font-size: 11.5px; fill: #222222; }
      .api-lbl { font-size: 12px; font-weight: bold; fill: #111111; }
      .cardinality { font-size: 12px; font-weight: bold; fill: #111111; }
      .pkg-box { fill: #ffffff; stroke: #222222; stroke-width: 1.8; }
      .pkg-tab { fill: #ffffff; stroke: #222222; stroke-width: 1.8; }
      .cls-box { fill: #ffffff; stroke: #222222; stroke-width: 1.5; }
      .div-line { stroke: #222222; stroke-width: 1.1; }
      .conn-solid { stroke: #222222; stroke-width: 1.5; fill: none; }
      .conn-dash { stroke: #444444; stroke-width: 1.4; stroke-dasharray: 5,4; fill: none; }
      .ball { fill: #ffffff; stroke: #222222; stroke-width: 2; }
      .socket { fill: none; stroke: #222222; stroke-width: 2.2; stroke-linecap: round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5" fill="none" stroke="#444444" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Package: Фронтенд -->
  <path d="M 50 42 L 50 20 L 160 20 L 170 42 Z" class="pkg-tab" />
  <rect x="50" y="42" width="820" height="113" class="pkg-box" />
  <text x="460.0" y="59" class="pkg-title" text-anchor="middle">Фронтенд</text>
  <!-- Package: Веб-сервис -->
  <path d="M 50 282 L 50 260 L 160 260 L 170 282 Z" class="pkg-tab" />
  <rect x="50" y="282" width="820" height="243" class="pkg-box" />
  <text x="460.0" y="299" class="pkg-title" text-anchor="middle">Веб-сервис</text>
  <!-- Package: Модель -->
  <path d="M 50 572 L 50 550 L 160 550 L 170 572 Z" class="pkg-tab" />
  <rect x="50" y="572" width="820" height="93" class="pkg-box" />
  <text x="460.0" y="589" class="pkg-title" text-anchor="middle">Модель</text>
  <!-- Package: База данных -->
  <path d="M 50 712 L 50 690 L 160 690 L 170 712 Z" class="pkg-tab" />
  <rect x="50" y="712" width="820" height="123" class="pkg-box" />
  <text x="460.0" y="729" class="pkg-title" text-anchor="middle">База данных</text>
  <rect x="75" y="75" width="145" height="58" class="cls-box" />
  <text x="147.5" y="93" class="cls-title-2line" text-anchor="middle">Лента</text>
  <text x="147.5" y="108" class="cls-title-2line" text-anchor="middle">видов топлива</text>
  <line x1="75" y1="113" x2="220" y2="113" class="div-line" />
  <line x1="75" y1="123" x2="220" y2="123" class="div-line" />
  <rect x="275" y="75" width="145" height="58" class="cls-box" />
  <text x="347.5" y="93" class="cls-title-2line" text-anchor="middle">Добавление</text>
  <text x="347.5" y="108" class="cls-title-2line" text-anchor="middle">вида топлива</text>
  <line x1="275" y1="113" x2="420" y2="113" class="div-line" />
  <line x1="275" y1="123" x2="420" y2="123" class="div-line" />
  <rect x="475" y="75" width="145" height="58" class="cls-box" />
  <text x="547.5" y="93" class="cls-title-2line" text-anchor="middle">Плитка</text>
  <text x="547.5" y="108" class="cls-title-2line" text-anchor="middle">видов топлива</text>
  <line x1="475" y1="113" x2="620" y2="113" class="div-line" />
  <line x1="475" y1="123" x2="620" y2="123" class="div-line" />
  <rect x="695" y="75" width="145" height="58" class="cls-box" />
  <text x="767.5" y="93" class="cls-title-2line" text-anchor="middle">Вход</text>
  <text x="767.5" y="108" class="cls-title-2line" text-anchor="middle">пользователя</text>
  <line x1="695" y1="113" x2="840" y2="113" class="div-line" />
  <line x1="695" y1="123" x2="840" y2="123" class="div-line" />
  <!-- Socket 1: API видов топлива -->
  <path d="M 317 215 A 14 14 0 1 1 343 215" class="socket" />
  <circle cx="330" cy="210" r="7.5" class="ball" />
  <text x="215" y="214" class="api-lbl" text-anchor="middle">API видов топлива</text>
  <!-- Socket 2: API пользователей -->
  <path d="M 727 215 A 14 14 0 1 1 753 215" class="socket" />
  <circle cx="740" cy="210" r="7.5" class="ball" />
  <text x="765" y="214" class="api-lbl" text-anchor="start">API пользователей</text>
  <line x1="147" y1="133" x2="322" y2="198" class="conn-dash" />
  <line x1="347" y1="133" x2="330" y2="196" class="conn-dash" />
  <line x1="547" y1="133" x2="338" y2="198" class="conn-dash" />
  <line x1="767" y1="133" x2="740" y2="196" class="conn-dash" />
  <line x1="330" y1="315" x2="330" y2="217.5" class="conn-solid" />
  <line x1="740" y1="315" x2="740" y2="217.5" class="conn-solid" />
  <rect x="75" y="315" width="460" height="195" class="cls-box" />
  <text x="305.0" y="333" class="cls-title" text-anchor="middle">Домен видов топлива</text>
  <line x1="75" y1="341" x2="535" y2="341" class="div-line" />
  <line x1="75" y1="351" x2="535" y2="351" class="div-line" />
  <text x="89" y="369" class="method">+ GET Propellants(maxMolarMass)</text>
  <text x="89" y="388" class="method">+ GET PropellantFeed(id, next)</text>
  <text x="89" y="407" class="method">+ GET PropellantDraft()</text>
  <text x="89" y="426" class="method">+ POST Propellant(name, image, video)</text>
  <text x="89" y="445" class="method">+ PUT Propellant(id)</text>
  <text x="89" y="464" class="method">+ DELETE Propellant(id)</text>
  <text x="89" y="483" class="method">+ POST PropellantLike(id, like)</text>
  <rect x="565" y="315" width="275" height="135" class="cls-box" />
  <text x="702.5" y="333" class="cls-title" text-anchor="middle">Домен пользователей</text>
  <line x1="565" y1="341" x2="840" y2="341" class="div-line" />
  <line x1="565" y1="351" x2="840" y2="351" class="div-line" />
  <text x="579" y="369" class="method">+ POST User(username, email, password)</text>
  <text x="579" y="388" class="method">+ POST UserLogin()</text>
  <text x="579" y="407" class="method">+ POST UserLogout()</text>
  <rect x="75" y="605" width="160" height="52" class="cls-box" />
  <text x="155.0" y="624" class="cls-title" text-anchor="middle">Propellant</text>
  <line x1="75" y1="633" x2="235" y2="633" class="div-line" />
  <line x1="75" y1="643" x2="235" y2="643" class="div-line" />
  <rect x="350" y="605" width="190" height="52" class="cls-box" />
  <text x="445.0" y="624" class="cls-title" text-anchor="middle">PropellantLike</text>
  <line x1="350" y1="633" x2="540" y2="633" class="div-line" />
  <line x1="350" y1="643" x2="540" y2="643" class="div-line" />
  <rect x="660" y="605" width="160" height="52" class="cls-box" />
  <text x="740.0" y="624" class="cls-title" text-anchor="middle">User</text>
  <line x1="660" y1="633" x2="820" y2="633" class="div-line" />
  <line x1="660" y1="643" x2="820" y2="643" class="div-line" />
  <line x1="155" y1="510" x2="155" y2="597" class="conn-dash" marker-end="url(#arrow)" />
  <line x1="445" y1="510" x2="445" y2="597" class="conn-dash" marker-end="url(#arrow)" />
  <line x1="740" y1="450" x2="740" y2="597" class="conn-dash" marker-end="url(#arrow)" />
  <rect x="75" y="745" width="160" height="40" class="cls-box" />
  <text x="155" y="770" class="cls-title" text-anchor="middle">propellants</text>
  <rect x="350" y="745" width="190" height="40" class="cls-box" />
  <text x="445" y="770" class="cls-title" text-anchor="middle">propellant_likes</text>
  <rect x="660" y="745" width="160" height="40" class="cls-box" />
  <text x="740" y="770" class="cls-title" text-anchor="middle">users</text>
  <line x1="155" y1="657" x2="155" y2="737" class="conn-dash" marker-end="url(#arrow)" />
  <line x1="445" y1="657" x2="445" y2="737" class="conn-dash" marker-end="url(#arrow)" />
  <line x1="740" y1="657" x2="740" y2="737" class="conn-dash" marker-end="url(#arrow)" />
  <line x1="235" y1="765" x2="350" y2="765" class="conn-solid" />
  <text x="250" y="758" class="cardinality">1</text>
  <text x="325" y="758" class="cardinality">0..*</text>
  <line x1="540" y1="765" x2="660" y2="765" class="conn-solid" />
  <text x="558" y="758" class="cardinality">0..*</text>
  <text x="635" y="758" class="cardinality">1</text>
  <path d="M 155 785 L 155 815 L 740 815 L 740 785" class="conn-solid" />
  <text x="165" y="805" class="cardinality">0..*</text>
  <text x="720" y="805" class="cardinality">1</text>
</svg>